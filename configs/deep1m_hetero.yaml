dataset:
  name: deep1m
  path: data/deep1m
  dim: 96
  format: hdf5
  file: deep-image-96-angular.hdf5
  max_base: 1000000
  normalize: true

execution:
  search_param_configs:
    - {nprobe: 8,  rerank_k: 50,  early_stop: false}
    - {nprobe: 16, rerank_k: 100, early_stop: false}
    - {nprobe: 32, rerank_k: 200, early_stop: false}
    - {nprobe: 64, rerank_k: 400, early_stop: false}
    - {nprobe: 128, rerank_k: 800, early_stop: false}

pricing:
  tiers: [0.001, 0.002, 0.005, 0.01, 0.02]
  reward_mode: satisfaction_retention

cost_model:
  base_per_ms: 0.00005
  fixed_overhead: 0.0001

policies:
  fixed:
    z_index: 2
    p_index: 2
    epsilon: 0.1
  hetero_linucb:
    alpha: 0.5
    temperature: 0.4

models:
  difficulty: models/deep1m/difficulty_v1.onnx

buyer:
  version: hetero
  best_dist_anchor: 0.2
  worst_dist_anchor: 0.9
  nprobe_recall:
    8: 0.83
    16: 0.92
    32: 0.96
    64: 0.98
    128: 0.99

shadow:
  sample_rate: 0.0

logging:
  output_dir: logs
  flush_every_n: 100

experiment:
  seed: 42
  n_queries: 10000
